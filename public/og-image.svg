<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Deep Midnight Blue Background -->
  <rect width="1200" height="630" fill="#080114" />
  
  <!-- Subtle Routing Grid/Dots -->
  <pattern id="dots" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
    <circle cx="2" cy="2" r="1.5" fill="#f4f6fb" fill-opacity="0.05" />
  </pattern>
  <rect width="1200" height="630" fill="url(#dots)" />

  <!-- NYG Monogram -->
  <g transform="translate(100, 100) scale(1.5)">
    <!-- N -->
    <path d="M15 80 V20 H25 L45 55 V20 H55 V80 H45 L25 45 V80 Z" fill="#f4f6fb" />
    <!-- Y -->
    <path d="M75 55 L90 20 H78 L65 48 L52 20 H40 L65 65 V80 H75 Z" fill="#f4f6fb" />
    <!-- Node -->
    <circle cx="65" cy="65" r="5" fill="#a62e23" />
  </g>

  <!-- Divider Line -->
  <rect x="250" y="140" width="2" height="40" fill="#f4f6fb" fill-opacity="0.2" />

  <!-- NYG Digital Wordmark -->
  <text x="280" y="172" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="42" fill="#f4f6fb" letter-spacing="-0.02em">NYG Digital</text>

  <!-- Main Value Proposition -->
  <text x="100" y="380" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="72" fill="#f4f6fb" letter-spacing="-0.02em">Websites and connected</text>
  <text x="100" y="470" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="72" fill="#f4f6fb" letter-spacing="-0.02em">systems that remove</text>
  
  <!-- Highlighted Text -->
  <rect x="90" y="490" width="520" height="85" rx="12" fill="#a62e23" fill-opacity="0.15" />
  <text x="100" y="560" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="72" fill="#a62e23" letter-spacing="-0.02em">manual work.</text>

  <!-- Route Line Decoration -->
  <path d="M900 150 L900 450 L1100 450" fill="none" stroke="#2b23a1" stroke-width="4" stroke-dasharray="8 8" />
  <circle cx="900" cy="150" r="8" fill="#f4f6fb" />
  <circle cx="1100" cy="450" r="8" fill="#a62e23" />
</svg>
